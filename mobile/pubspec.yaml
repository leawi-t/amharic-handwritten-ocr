name: amharic_ocr
description: Handwritten Amharic text recognition mobile app (AAU CS Final Year Project).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Planned packages. Add them with `flutter pub add` so you get current,
  # compatible versions, then record them in the dependency list (guideline 8.5):
  #   flutter pub add image_picker   # camera capture and gallery upload (FR-01, FR-02)
  #   flutter pub add http           # calls to the FastAPI backend
  #   flutter pub add path_provider  # local storage of saved documents
  #   flutter pub add share_plus     # export / share the corrected text

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Amharic needs an Ethiopic font. Download Noto Sans Ethiopic (SIL Open Font
  # Licence), put it in assets/fonts/, then uncomment:
  # fonts:
  #   - family: NotoSansEthiopic
  #     fonts:
  #       - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
